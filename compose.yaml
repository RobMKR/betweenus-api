services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: betweenus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: betweenus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betweenus"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
